name: Agente diário de vagas PMP

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Dias úteis às 09h00 GMT
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install feedparser pandas requests

      - name: Executar buscar_vagas.py
        run: python buscar_vagas.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit e push dos arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vagas_*.csv vagas_*.html STATUS.txt
          git commit -m "Atualização automática diária" || echo "Sem alterações"
          git push
