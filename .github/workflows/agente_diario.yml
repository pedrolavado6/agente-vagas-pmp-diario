name: Agente diário de vagas PMP

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Dias úteis às 09h00 GMT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install feedparser pandas requests

      - run: python buscar_vagas.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vagas_*.csv vagas_*.html STATUS.txt
          git commit -m "Atualização automática diária" || echo "Sem alterações"
          git push
